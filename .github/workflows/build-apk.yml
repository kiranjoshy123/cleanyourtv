name: Build launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/*.apk
      - name: Publish APK to apk branch
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk /tmp/tvhome.apk
          sha256sum /tmp/tvhome.apk > /tmp/tvhome.apk.sha256
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf -q . 
          cp /tmp/tvhome.apk /tmp/tvhome.apk.sha256 .
          git add tvhome.apk tvhome.apk.sha256
          git commit -q -m "tvhome.apk from ${GITHUB_SHA}"
          git push -f origin apk
